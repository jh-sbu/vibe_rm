[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std", "safe-decode"] }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
encoding_rs = "0.8"
bsa = { path = "crates/bsa", package = "vrm-bsa" }
esp = { path = "crates/esp", package = "vrm-esp" }
nif = { path = "crates/nif", package = "vrm-nif" }
vfs = { path = "crates/vfs", package = "vrm-vfs" }
havok = { path = "crates/havok", package = "vrm-havok" }
papyrus = { path = "crates/papyrus", package = "vrm-papyrus" }

[package]
name = "vibe_rm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
glam.workspace = true
bytemuck.workspace = true
rayon.workspace = true
bsa.workspace = true
esp.workspace = true
nif.workspace = true
vfs.workspace = true
wgpu = "30"
winit = "0.30"
pollster = "0.4"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
png = "0.17"
cpal = { version = "0.18", features = ["pulseaudio"] }
havok.workspace = true
papyrus.workspace = true
rapier3d = "0.36"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
